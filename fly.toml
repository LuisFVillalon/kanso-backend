app = "taskmaster-backend-bhccbw"
# Ashburn, VA: beside the Supabase database (aws us-east-1). Each request
# makes several DB round trips, so the API must sit next to the database;
# from Amsterdam every query crossed the Atlantic (~2 s for the daily debrief).
primary_region = "iad"

[http_service]
auto_start_machines = true
auto_stop_machines = "stop"
force_https = true
internal_port = 8080
# Keep one machine warm: a stopped machine takes ~10 s to boot, which is what
# a first-time visitor clicking "Try the demo" would otherwise wait through.
min_machines_running = 1
processes = [ "app" ]

  [[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 512
